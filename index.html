<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vrinda Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0B0B0B;--panel:#131313;--panel2:#1A1A1A;--line:#242424;--text:#fff;--muted:#8E8E8E;--acc:#F26A1B;--btn:linear-gradient(180deg,#F8782A 0%,#D8560A 100%);--ink:#fff;--ok:#1FCB84;--bad:#F04848;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0B0B0B;--panel:#131313;--panel2:#1A1A1A;--line:#242424;--text:#fff;--muted:#8E8E8E;--acc:#F26A1B;--ink:#fff;--ok:#1FCB84;--bad:#F04848}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'Poppins',system-ui,sans-serif}
h1,h2,h3,.brand,.big{font-family:'Exo 2','Poppins',sans-serif}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:12px 28px;border-bottom:1px solid var(--line);background:#0F0F0F}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:.08em;color:var(--acc)}
.pill{border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:500;background:rgba(31,203,132,.08);cursor:pointer;min-height:44px}
.pill.off{border-color:var(--bad);color:var(--bad);background:rgba(240,72,72,.08)}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding:24px 28px}
aside{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
main>.panel{margin-top:20px}
.panel>h2{font-size:22px;font-weight:700;color:var(--acc);margin:0 0 6px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--btn);display:grid;place-items:center;font:800 24px 'Exo 2',sans-serif;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
nav.panel{display:flex;flex-direction:column;gap:4px;padding:12px}
.nb{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:12px 14px;border-radius:10px;color:#C4C4C4;cursor:pointer;min-height:44px;white-space:nowrap;font-weight:500}
.nb:hover{background:var(--panel2)}
.nb[aria-current=page]{background:var(--panel2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nb[aria-current=page] .ic{color:var(--acc)}
main{min-width:0;padding-bottom:110px}
h1{font-size:30px;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px;max-width:64ch}
.note{color:var(--muted);font-size:13px;margin-top:32px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));padding:28px 8px}
.stat{text-align:center;padding:4px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat h3{font-size:19px;font-weight:600;color:var(--acc);margin:0 0 18px}
.stat .big{display:block;font-size:42px;font-weight:800;line-height:1.1}
.stat small{display:block;margin-top:8px;color:var(--muted);font-weight:600}
.row>span:empty{display:none}.row input{min-width:200px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px 20px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.panel>.row:last-child{border-bottom:0;padding-bottom:4px}
.row b{font-weight:500;display:block}.row small{display:block;color:var(--muted);font-size:13px}
.sel{display:flex;gap:8px;flex-wrap:wrap}
select,input{background:var(--panel2);border:1px solid #2C2C2C;border-radius:8px;padding:9px 12px;min-height:44px}
select:hover,input:hover{border-color:#3C3C3C}
select:disabled,input:disabled{opacity:.4}
.sw{width:46px;height:26px;border-radius:13px;border:1px solid #333;background:#2A2A2A;position:relative;padding:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8E8E8E}
.sw.on{background:var(--btn);border-color:var(--acc)}.sw.on::after{left:22px;background:#fff}
@media (prefers-reduced-motion:no-preference){.sw,.sw::after,.btn{transition:all .15s}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--ink);border:0;border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--panel2);border:1px solid #2C2C2C;font-weight:500}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc);filter:none}
.btn.danger{background:var(--bad)}
.ev{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.panel>.ev:last-child{border-bottom:0}
.tag{font-weight:600}.tag.b{color:var(--ok)}.tag.r{color:var(--acc)}.tag.p{color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.filters button{background:var(--panel2);border:1px solid #2C2C2C;border-radius:999px;padding:8px 16px;cursor:pointer;min-height:44px}
.filters button[aria-pressed=true]{background:var(--btn);border-color:var(--acc);color:#fff}
form{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
form input{flex:1 1 220px}
.err{color:var(--bad);min-height:24px;margin:0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--acc);padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#bar.show{display:flex}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--btn);color:#fff;padding:10px 20px;border-radius:8px;font-weight:500;display:none;max-width:90vw}
#toast.show{display:block}
.shell.solo{grid-template-columns:minmax(0,1fr);max-width:1000px}
.servers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:8px}
.sc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px}
.sc .avatar{width:72px;height:72px;font-size:30px}
.sc b{font:700 19px 'Exo 2',sans-serif}
.lgcat{border-bottom:1px solid var(--line)}.lgcat:last-child{border-bottom:0}
.lgh{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding:8px 0}
.lgt{background:none;border:0;font:700 17px 'Exo 2',sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:#fff;min-height:44px;padding:0}
.lgt .ic{width:16px;height:16px;color:var(--muted)}.lgt[aria-expanded=true] .ic{transform:rotate(90deg);color:var(--acc)}
.lgb{padding:0 0 14px 6px}
.chip{font-size:13px;border:1px solid #2C2C2C;border-radius:999px;padding:5px 12px;color:var(--ok)}
input[type=checkbox]{min-height:0;padding:0;width:20px;height:20px;accent-color:var(--acc);flex:none}
.btn.ghost[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:22px 0 0}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 16px;color:var(--muted);cursor:pointer;font-weight:500;min-height:44px;white-space:nowrap}
.tab:hover{color:#fff}.tab[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
.tabs+.panel,.tabs+*{margin-top:20px}
.gl{font-size:12px;font-weight:600;color:var(--muted);padding:14px 14px 4px}
@media (max-width:860px){
.gl{display:none}
.shell{grid-template-columns:1fr;padding:16px;gap:16px}
nav.panel{flex-direction:row;overflow-x:auto}
.top{padding:12px 16px}
.stat{border-left:0}
.row{grid-template-columns:minmax(0,1fr) auto}.row .sel,.row>select,.row>input{grid-column:1/-1}
}
a.btn{text-decoration:none}img.avatar{object-fit:cover}
</style>
</head>

async function doSave(){if(saving)return;saving=true;let r=null;try{r=await api('/api/guilds/'+server+'/settings',{method:'PUT',body:JSON.stringify(cur)})}catch(e){}saving=false;
if(r&&r.ok){saved=clone(cur);toast('Changes saved');render()}
else if(r&&r.status===401){toast('Your session expired. Log in again.');me=null;server=null;render()}
else toast('Could not save'+(r&&r.j&&r.j.error?': '+r.j.error:'. Try again.'))}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}me=null;server=null;SERVERS=[];render()}
function render(){
const sv=SERVERS.find(v=>v.id===server);
document.querySelector('.shell').classList.toggle('solo',!sv);document.querySelector('aside').hidden=!sv;
const st=$('#status');st.hidden=!sv;
$('#who').textContent=me&&me.user?me.user.name:'';$('#logout').hidden=!me;
if(!sv){$('#main').innerHTML=booting?'<p class="muted">Loading…</p>':loadErr?errView():!me?loginView():picker();$('#bar').classList.remove('show');return}
$('#srv').innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">${av(sv)}<div><b style="font:700 18px 'Exo 2',sans-serif;color:var(--acc)">${sv.n}</b><div class="muted" style="font-size:13px">Protected by Vrinda</div></div></div><div class="kv"><span class="muted">Protection</span><b style="color:${cur.master?'var(--ok)':'var(--bad)'}">${cur.master?'On':'Paused'}</b></div><div class="kv"><span class="muted">Protections on</span><b>${protOn()}</b></div><div class="kv"><span class="muted">Whitelisted</span><b>${cur.wl.length} / ${wlLimit()}</b></div><button class="btn ghost" style="width:100%;margin-top:12px" data-act="servers">${ic('swap')}Switch server</button>`;
$('#nav').innerHTML=GROUPS.map(g=>(g[0]?`<div class="gl">${g[0]}</div>`:'')+g[1].map(x=>`<button class="nb" data-view="${x[0]}"${x[0]===view?' aria-current="page"':''}>${ic(x[0])}${x[1]}</button>`).join('')).join('');
$('#main').innerHTML=(view==='overview'?overview():section(view))+'<p class="note">Changes are saved to Vrinda\'s database when you press Save changes. The bot reads them from there.</p>';
st.textContent=cur.master?'Protection on':'Protection paused';st.className='pill'+(cur.master?'':' off');bar()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
document.addEventListener('click',e=>{
const t=e.target.closest('button');if(!t)return;
if(t.dataset.pick){pickServer(t.dataset.pick);return}
if(t.dataset.lgopen){const c=t.dataset.lgopen;logUI.open[c]=!logUI.open[c];render();return}
if(t.dataset.sub!==undefined){subs[view]=+t.dataset.sub;render();return}
if(t.dataset.view){view=t.dataset.view;err='';errs={};render();scrollTo(0,0);return}
if(t.dataset.filter){filter=t.dataset.filter;render();return}
if(t.dataset.rm!==undefined){const [f,i]=t.dataset.rm.split(':');listRef(f).splice(+i,1);render();return}
const a=t.dataset.act;if(!a)return;
if(a==='logout'){logout();return}
if(a==='refresh'){loadErr='';booting=true;render();boot();return}
if(a==='save'){doSave();return}
if(a==='master')cur.master=!cur.master;
else if(a.startsWith('sw:')){const id=a.slice(3),v=cur.v[id];if(typeof v==='boolean')cur.v[id]=!v;else v.on=!v.on}
else if(a==='reset')cur=clone(saved);
else if(a==='servers'){if(dirty())toast('Unsaved changes discarded.');server=null;view='overview'}
else if(a==='resetall'){cur=def();toast('All settings reset. Save to keep it.')}
else if(a.startsWith('all:')){const [,k,f]=a.split(':'),on=f==='1';F[k].forEach(x=>{if(x.t==='h')return;const v=cur.v[x.id];if(typeof v==='boolean')cur.v[x.id]=on;else if(v&&typeof v==='object')v.on=on});if(k==='antinuke'&&on)cur.master=true}
else if(a.startsWith('rst:')){const k=a.slice(4);F[k].forEach(x=>{if(x.t!=='h')cur.v[x.id]=clone(x.def)});if(k==='antinuke')cur.master=true;toast(META[k][0]+' reset to defaults. Save to keep it.')}
else if(a==='test'){const dl=cur.v['lg.default'].trim(),c=F.logs.filter(f=>f.t==='ch'&&cur.v[f.id].on&&(cur.v[f.id].v.trim()||dl));if(!c.length){toast('Turn on a log type and choose a channel first.');return}EV.unshift(['Test','Test log from the dashboard','Sent to '+[...new Set(c.map(f=>cur.v[f.id].v.trim()||dl))].join(', '),'Just now']);toast('Test log added. Preview only, nothing was sent to Discord.')}
else if(a==='lg-all'){logUI.all=!logUI.all}
else if(a==='lg-all-apply'){const v=($('#lgAll').value||'').trim();if(!v){toast('Enter a channel first.');return}setCh(LTYPES,v);logUI.all=false;toast('Channel set for all types.')}
else if(a==='lg-clear'){LTYPES.forEach(id=>{cur.v[id].v='';cur.v[id].on=false});toast('Channels removed from all types.')}
else if(a==='lg-mass'){logUI.mass=!logUI.mass;logUI.sel={}}
else if(a==='lg-selall'){LTYPES.forEach(id=>logUI.sel[id]=true)}
else if(a==='lg-selnone'){logUI.sel={}}
else if(a==='lg-mass-apply'){const ids=LTYPES.filter(id=>logUI.sel[id]),v=($('#lgMass').value||'').trim();if(!ids.length){toast('Select at least one type.');return}if(!v){toast('Enter a channel first.');return}setCh(ids,v);toast('Channel set for '+ids.length+' types.')}
else if(a.startsWith('lg-cat-apply:')){const c=a.slice(13),ids=LTYPES.filter(id=>id.startsWith('lg.'+c+'.')),v=($('#lgCat').value||'').trim();if(!v){toast('Enter a channel first.');return}setCh(ids,v);logUI.setcat=null}
else if(a.startsWith('lg-cat-clear:')){const c=a.slice(13);LTYPES.filter(id=>id.startsWith('lg.'+c+'.')).forEach(id=>{cur.v[id].v='';cur.v[id].on=false});logUI.setcat=null}
else if(a.startsWith('lg-cat:')){const c=a.slice(7);logUI.open[c]=true;logUI.setcat=c}
render();if(a.startsWith('lg-cat:')){const el=$('#lgCat');if(el&&el.focus)el.focus()}});
document.addEventListener('change',e=>{
if(e.target.dataset.lgsel){logUI.sel[e.target.dataset.lgsel]=e.target.checked;render();return}
const tn=e.target.dataset.txt;if(tn&&e.target.type==='number'){let n=parseInt(e.target.value);n=isNaN(n)?5:Math.min(50,Math.max(1,n));cur.v[tn]=String(n);render();return}
const s=e.target.dataset.sel;if(!s)return;const [k,id]=s.split(':');if(k==='v')cur.v[id]=e.target.value;else cur.v[id][k]=e.target.value;render()});
document.addEventListener('input',e=>{
if(e.target.dataset.lq!==undefined){logUI.q=e.target.value;$('#logList').innerHTML=logList();return}
const id=e.target.dataset.txt;if(!id)return;if(typeof cur.v[id]==='string')cur.v[id]=e.target.value;else cur.v[id].v=e.target.value;bar()});
document.addEventListener('submit',e=>{
e.preventDefault();const f=e.target.dataset.form;if(!f||!LM[f])return;
const M=LM[f],L=listRef(f);let v=e.target.querySelector('input').value.trim();
if(!v){errs[f]='Enter a value to add.';render();return}
if(M.lim&&L.length>=M.lim()){errs[f]=M.full();render();return}
if(!/^[@#]/.test(v))v=M.pre+v;
if(L.some(u=>u.toLowerCase()===v.toLowerCase())){errs[f]=v+' is already in the list.';render();return}
L.push(v);errs[f]='';render()});
render();boot();
</script>
</body>
</html>
